<!DOCTYPE html>
<html>
<head>
<title>Shree Sai Garden Billing</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    padding:15px;
}

.menu button{
    padding:12px;
    margin:5px;
    border:none;
    background:#388e3c;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

input{
    padding:10px;
    margin:5px;
    width:90%;
}

table{
    width:100%;
    background:white;
    border-collapse:collapse;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

.cart button{
    padding:4px 8px;
}

.total{
    font-size:22px;
    font-weight:bold;
}

.action button{
    padding:12px;
    margin:5px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>🌿 Shree Sai Garden</h1>
<p>Restaurant Billing</p>
</header>


<div class="container">

<input id="customer" placeholder="Customer Name">

<input id="table" placeholder="Table No">


<h3>Menu</h3>

<div class="menu">
<button onclick="addItem('Shev Bhaji',100)">
Shev Bhaji ₹100
</button>

<button onclick="addItem('Dal Tadka',110)">
Dal Tadka ₹110
</button>

<button onclick="addItem('Mix Veg',180)">
Mix Veg ₹180
</button>
<button onclick="addItem('Paneer Masala',180)">
Paneer Masala ₹180
</button>

<button onclick="addItem('Butter Roti',25)">
Butter Roti ₹25
</button>


<button onclick="addItem('Tea',20)">
Tea ₹20
</button>


<button onclick="addItem('Veg Biryani',150)">
Veg Biryani ₹150
</button>


<button onclick="addItem('Dal Tadka',130)">
Dal Tadka ₹130
</button>


<button onclick="addItem('Cold Drink',40)">
Cold Drink ₹40
</button>


</div>


<h3>Bill</h3>

<table id="billTable">

<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Remove</th>
</tr>
</thead>

<tbody></tbody>

</table>


<h2 class="total" id="grandTotal">
Grand Total : ₹0
</h2>


<div class="action">

<button onclick="printBill()">
🖨 Print
</button>

<button onclick="whatsappBill()">
📱 WhatsApp
</button>

<button onclick="saveBill()">
💾 Save
</button>

</div>


</div>



<script>

let bill={};


function addItem(name,price){

if(!bill[name]){
bill[name]={
qty:0,
price:price
};
}

bill[name].qty++;

render();

}



function changeQty(name,value){

bill[name].qty+=value;

if(bill[name].qty<=0){
delete bill[name];
}

render();

}



function removeItem(name){

delete bill[name];

render();

}



function render(){

let tbody=document.querySelector("#billTable tbody");

tbody.innerHTML="";

let total=0;


for(let item in bill){

let data=bill[item];

let itemTotal=data.qty*data.price;

total+=itemTotal;


tbody.innerHTML+=`

<tr>

<td>${item}</td>

<td>
<button onclick="changeQty('${item}',-1)">-</button>

${data.qty}

<button onclick="changeQty('${item}',1)">+</button>
</td>

<td>₹${data.price}</td>

<td>₹${itemTotal}</td>

<td>
<button onclick="removeItem('${item}')">
❌
</button>
</td>

</tr>

`;

}


document.getElementById("grandTotal").innerHTML=
"Grand Total : ₹"+total;


}




function saveBill(){

localStorage.setItem(
"lastBill",
JSON.stringify(bill)
);

alert("Bill Saved ✅");

}



function printBill(){

window.print();

}



function whatsappBill(){

let text="🌿 Shree Sai Garden Bill%0A%0A";


for(let item in bill){

text+=item+
" x "+
bill[item].qty+
"%0A";

}


text+="%0A"+document.getElementById("grandTotal").innerText;


window.open(
"https://wa.me/?text="+text
);


}


</script>


</body>
</html>
